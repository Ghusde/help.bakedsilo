    <rect x="712" y="160" width="188" height="100" rx="10" fill="#fff" stroke="#EFEAE0" stroke-width="2"/>
    <rect x="732" y="180" width="94" height="10" rx="5" fill="#E4DFD3"/>
    <rect x="732" y="204" width="80" height="20" rx="6" fill="#2C2C2A"/>
    <rect x="732" y="234" width="66" height="9" rx="4.5" fill="#D85A30" opacity=".55"/>
  </g>

  <!-- Kartu grafik -->
  <rect x="288" y="284" width="612" height="156" rx="10" fill="#fff" stroke="#EFEAE0" stroke-width="2"/>
  <rect x="312" y="306" width="120" height="10" rx="5" fill="#E4DFD3"/>
  <g fill="#D85A30" opacity=".28">
