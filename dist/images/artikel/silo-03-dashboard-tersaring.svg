    <rect x="452" y="392" width="46" height="28" rx="4"/>
    <rect x="522" y="338" width="46" height="82" rx="4"/>
    <rect x="592" y="366" width="46" height="54" rx="4"/>
    <rect x="662" y="330" width="46" height="90" rx="4"/>
    <rect x="732" y="384" width="46" height="36" rx="4"/>
