<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img"
     aria-label="Skema antarmuka: dialog pemilihan unit dengan dua unit tercentang dan tombol Simpan silo">
  <rect width="960" height="500" fill="#F5F0E6"/>

  <!-- Jendela aplikasi di belakang, diredupkan -->
  <rect x="28" y="28" width="904" height="444" rx="12" fill="#fff" stroke="#E8E2D6" stroke-width="2"/>
  <path d="M28 40a12 12 0 0 1 12-12h880a12 12 0 0 1 12 12v44H28z" fill="#2C2C2A"/>
  <rect x="28" y="84" width="904" height="388" fill="#2C2C2A" opacity=".38"/>

  <!-- Dialog -->
  <rect x="252" y="96" width="456" height="316" rx="14" fill="#fff" stroke="#E8E2D6" stroke-width="2"/>
  <text x="284" y="140" font-family="Inter, system-ui, sans-serif" font-size="17"
        font-weight="600" fill="#2C2C2A">Pilih unit untuk silo</text>
  <text x="284" y="164" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8A8578">
    Boleh lebih dari satu unit.
  </text>
  <line x1="252" y1="182" x2="708" y2="182" stroke="#EFEAE0" stroke-width="2"/>

  <!-- Baris unit: 2 tercentang -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#2C2C2A">
    <rect x="284" y="200" width="18" height="18" rx="5" fill="#D85A30"/>
    <path d="M288.5 209.5l3.5 3.5 5.5-6" fill="none" stroke="#fff" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="314" y="214">Berawa</text>

    <rect x="284" y="240" width="18" height="18" rx="5" fill="#D85A30"/>
    <path d="M288.5 249.5l3.5 3.5 5.5-6" fill="none" stroke="#fff" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="314" y="254">Canggu</text>

    <rect x="284" y="280" width="18" height="18" rx="5" fill="#fff" stroke="#D6D2C6" stroke-width="2"/>
    <text x="314" y="294" fill="#8A8578">Ubud</text>

    <rect x="284" y="320" width="18" height="18" rx="5" fill="#fff" stroke="#D6D2C6" stroke-width="2"/>
    <text x="314" y="334" fill="#8A8578">Seminyak</text>
  </g>

  <!-- Footer dialog -->
  <line x1="252" y1="356" x2="708" y2="356" stroke="#EFEAE0" stroke-width="2"/>
  <rect x="472" y="370" width="82" height="30" rx="8" fill="#fff" stroke="#E8E2D6" stroke-width="2"/>
  <text x="513" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="13" fill="#8A8578">Batal</text>
  <rect x="568" y="370" width="108" height="30" rx="8" fill="#D85A30"/>
  <text x="622" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#fff">Simpan silo</text>

  <!-- Penanda langkah -->
  <circle cx="252" cy="212" r="17" fill="#D85A30"/>
  <text x="252" y="218" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="16" font-weight="700" fill="#fff">2</text>
</svg>
